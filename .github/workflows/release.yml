name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Verify tag matches gem version
        run: ruby -Ilib -rjobcompat/version -e 'abort "Tag/version mismatch" unless ENV.fetch("GITHUB_REF_NAME") == "v#{Jobcompat::VERSION}"'
      - name: Require final public metadata
        run: ruby -rrubygems -e 's = Gem::Specification.load("jobcompat.gemspec"); abort "Missing release URL metadata" unless s && s.homepage&.start_with?("https://") && %w[source_code_uri changelog_uri bug_tracker_uri].all? { |key| s.metadata[key]&.start_with?("https://") }'
      - run: bundle exec rake test
      - run: mkdir -p pkg && gem build jobcompat.gemspec --output pkg/jobcompat.gem
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: gem push pkg/jobcompat.gem
